[package]
name = "steam-scanner"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "steam-scanner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "z"
lto = true
strip = true
